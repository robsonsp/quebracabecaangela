<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quebra-cabeça: Transfusão Segura</title>
<style>
:root{--bg:#f3f6f8;--surface:#fff;--ink:#16303d;--muted:#5b7280;--accent:#d8432f;--ok:#1f9d6b;--line:#cfdae0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b22;--surface:#18272f;--ink:#e8f0f4;--muted:#93a8b3;--accent:#f0614d;--ok:#3cc790;--line:#2c4250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b22;--surface:#18272f;--ink:#e8f0f4;--muted:#93a8b3;--accent:#f0614d;--ok:#3cc790;--line:#2c4250;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:980px;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px}
p.sub{margin:0 0 14px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.bar .sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#wrap{position:relative}
#board{display:grid;gap:2px;aspect-ratio:16/9;width:100%;background:var(--line);padding:2px;border-radius:10px;user-select:none;touch-action:manipulation}
.t{background-repeat:no-repeat;cursor:grab;border-radius:2px;transition:transform .12s,box-shadow .12s}
.t.sel{outline:4px solid var(--accent);outline-offset:-4px;z-index:2;transform:scale(.96)}
.t.ok{box-shadow:inset 0 0 0 2px var(--ok)}
.t.over{filter:brightness(1.2)}
#prev{display:none;width:100%;border-radius:10px;border:2px solid var(--line)}
#win{display:none;position:absolute;inset:0;background:rgba(15,27,34,.82);color:#fff;border-radius:10px;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:10px}
#win h2{margin:0;font-size:1.8rem}
@media (prefers-reduced-motion:reduce){.t{transition:none}}
</style>
</head>
<body>
<main>
<h1>Quebra-cabeça: Transfusão Segura</h1>
<p class="sub">Toque em duas peças para trocá-las de lugar (ou arraste uma sobre a outra).</p>
<div class="bar">
<select id="lvl" aria-label="Dificuldade">
<option value="4x2">Fácil · 8 peças</option>
<option value="6x3" selected>Médio · 18 peças</option>
<option value="8x4">Difícil · 32 peças</option>
<option value="10x5">Expert · 50 peças</option>
</select>
<button class="main" id="new">Embaralhar</button>
<button id="pv" aria-pressed="false">Ver modelo</button>
<span class="sp"></span>
<span class="stat" id="mv">Jogadas: 0</span>
<span class="stat" id="tm">Tempo: 0:00</span>
<span class="stat" id="pc">Certas: 0</span>
</div>
<div id="wrap">
<div id="board"></div>
<img id="prev" alt="Modelo completo do quebra-cabeça">
<div id="win"><h2>Parabéns! 🎉</h2><div id="ws"></div><button class="main" id="again">Jogar novamente</button></div>
</div>
</main>

const $=id=>document.getElementById(id);
const board=$('board');$('prev').src=IMG;
let C,R,order,sel=null,moves=0,t0=0,timer=null,done=false,drag=null;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function build(){
 board.innerHTML='';
 board.style.gridTemplateColumns=`repeat(${C},1fr)`;
 board.style.gridTemplateRows=`repeat(${R},1fr)`;
 order.forEach((p,i)=>{
  const d=document.createElement('div');d.className='t';d.dataset.i=i;d.draggable=true;
  const x=p%C,y=Math.floor(p/C);
  d.style.backgroundImage=`url(${IMG})`;
  d.style.backgroundSize=`${C*100}% ${R*100}%`;
  d.style.backgroundPosition=`${C>1?x/(C-1)*100:0}% ${R>1?y/(R-1)*100:0}%`;
  d.addEventListener('click',()=>pick(i));
  d.addEventListener('dragstart',e=>{drag=i;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','x')});
  d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
  d.addEventListener('dragleave',()=>d.classList.remove('over'));
  d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');if(drag!==null&&drag!==i)swap(drag,i);drag=null});
  board.appendChild(d);
 });
 mark();
}
function mark(){
 let n=0;
 [...board.children].forEach((d,i)=>{const ok=order[i]===i;d.classList.toggle('ok',ok);if(ok)n++;d.classList.toggle('sel',sel===i)});
 $('pc').textContent='Certas: '+n+'/'+order.length;
 return n;
}
function pick(i){
 if(done)return;
 if(sel===null){sel=i;mark();return}
 if(sel===i){sel=null;mark();return}
 swap(sel,i);
}
function swap(a,b){
 if(done)return;
 if(!t0){t0=Date.now();timer=setInterval(()=>{$('tm').textContent='Tempo: '+fmt(Math.floor((Date.now()-t0)/1000))},500)}
 [order[a],order[b]]=[order[b],order[a]];
 const A=board.children[a],B=board.children[b];
 ['backgroundPosition'].forEach(k=>{const t=A.style[k];A.style[k]=B.style[k];B.style[k]=t});
 sel=null;moves++;$('mv').textContent='Jogadas: '+moves;
 if(mark()===order.length)win();
}
function win(){
 done=true;clearInterval(timer);
 const s=Math.floor((Date.now()-t0)/1000);
 $('ws').textContent=`Concluído em ${fmt(s)} com ${moves} jogadas.`;
 $('win').style.display='flex';
}
function start(){
 [C,R]=$('lvl').value.split('x').map(Number);
 const n=C*R;order=[...Array(n).keys()];
 do{for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
 while(order.every((p,i)=>p===i));
 clearInterval(timer);t0=0;moves=0;sel=null;done=false;
 $('mv').textContent='Jogadas: 0';$('tm').textContent='Tempo: 0:00';
 $('win').style.display='none';
 build();
}
$('new').onclick=start;$('again').onclick=start;$('lvl').onchange=start;
$('pv').onclick=()=>{
 const on=$('prev').style.display!=='block';
 $('prev').style.display=on?'block':'none';board.style.display=on?'none':'grid';
 $('pv').setAttribute('aria-pressed',on);$('pv').textContent=on?'Voltar ao jogo':'Ver modelo';
};
start();
</script>
